# Project-wide Gradle settings.

# JVM arguments (more memory for RN builds)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel + caching
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX + Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Flipper (React Native Debugger) version
FLIPPER_VERSION=0.182.0

# Architectures (can be overridden in CLI with -PreactNativeArchitectures=x86_64)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (TurboModules + Fabric)
newArchEnabled=false

# JS Engine (Expo defaults to JSC here; switch to Hermes if needed)
expo.jsEngine=hermes
hermesEnabled=true

# Expo media/image configs
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Dev client network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Enable ProGuard in release builds
android.enableProguardInReleaseBuilds=true

# ✅ Kotlin setup
kotlin.version=1.8.22
kotlin.code.style=official
kotlin.jvm.target.validation.mode=IGNORE

